plugins {
	id "com.crystaelix.loom" version "1.13-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.packagedauto"
			includeGroup "thelm.packagedexcrafting"
			includeGroup "thelm.packagedexexcrafting"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://modmaven.dev/"
			}
		}
		filter {
			includeGroup "appeng"
			includeGroup "mekanism"
		}
	}
}

def mcVersion = "1.20.1"
def modName = "PackagedExExExCrafting"
def modId = "packagedexexexcrafting"
def specVersion = "1"
def vendor = "thelm"

group = "thelm.packagedexexexcrafting"
version = "1.0.0.0"

def archivesName = "${modName}-${mcVersion}"
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	runs {
		configureEach {
			property "forge.logging.console.level", "debug"
		}
		client
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.20.1"
	mappings loom.layered {
		officialMojangMappings()
		parchment "org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip"
	}
	forge "net.minecraftforge:forge:1.20.1-47.4.20"

	// Dependencies
	modImplementation "thelm.packagedauto:PackagedAuto-1.20.1:3.4.15.46"
	modImplementation "thelm.packagedexcrafting:PackagedExCrafting-1.20.1:3.4.0.20"
	modImplementation "thelm.packagedexexcrafting:PackagedExExCrafting-1.20.1:1.0.0.6"
	modImplementation "curse.maven:cucumber-272335:7180783"
	modImplementation "curse.maven:extended-crafting-expanded-reforked-1531359:8025586"
	modImplementation("mezz.jei:jei-1.20.1-forge:15.20.0.129") {transitive = false}
	modImplementation "org.appliedenergistics:guideme:20.1.15"
	modImplementation "appeng:appliedenergistics2-forge:15.4.10"
	modImplementation "vazkii.patchouli:Patchouli:1.20.1-84.1-FORGE"

	// Testing
	modImplementation "mekanism:Mekanism:1.20.1-10.4.16.80"
	modImplementation "curse.maven:applied-mekanistics-574300:7244744"

	//Performance
	modImplementation "curse.maven:yeetusexperimentus-635427:4680832"
	implementation "io.github.llamalad7:mixinextras-forge:0.5.0"
	modImplementation "curse.maven:modernfix-790626:7515215"
	modImplementation "curse.maven:ferritecore-429235:4810975"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact sourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = "${mcVersion}-${project.version}"
	changelog = file("changelog.md").text
	type = BETA
	modLoaders.addAll("forge", "neoforge")
	additionalFiles.from(sourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1541608"
		minecraftVersions.add(mcVersion)
		client = true
		server = true
		requires "packagedauto", "packagedexcrafting", "packagedexexcrafting", "extended-crafting-expanded-reforked"
		optional "applied-energistics-2"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "PqcQrMTX"
		minecraftVersions.add(mcVersion)
		requires "packagedauto", "packagedexcrafting", "packagedexexcrafting"
		optional "ae2"
	}
}
